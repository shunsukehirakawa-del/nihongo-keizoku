<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIHONGO KEIZOKU</title>
    <!-- CSS読み込み -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. メイン画面（トップ画面） -->
    <div id="homeView">
        <h1 class="logo">NIHONGO<br>KEIZOKU</h1>
        <p class="subtitle">Listening, Reading &amp; Shadowing<br><span class="sub-time">5 mins a day</span></p>
        <button class="start-btn" id="startBtn">START</button>
    </div>

    <!-- 2. コンテンツ画面（学習画面） -->
    <div id="contentView">
        <header>
            <h1 class="logo">NIHONGO KEIZOKU</h1>
            <p class="subtitle">Listening, Reading &amp; Shadowing — 5 mins a day</p>
            <div class="controls">
                <button class="btn btn-secondary" id="howToBtn">How to use / Cómo usar</button>
            </div>
        </header>

        <main>
            <h2 class="section-title">Open Access / Acceso Abierto</h2>
            <div class="articles-grid" id="openArticles">
                <!-- JSで記事カードが読み込まれます -->
            </div>

            <h2 class="section-title" style="margin-top: 40px;">Members Only / Solo para miembros</h2>
            <div class="articles-grid" id="memberArticles">
                <!-- JSで記事カードが読み込まれます -->
            </div>
        </main>
    </div>

    <!-- 3. モーダル画面（言語選択・使い方・記事表示用） -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <div id="modalBody">
                <!-- 動的にコンテンツが挿入されます -->
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
