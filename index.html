<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NIHONGO KEIZOKU - Listening, Reading & Shadowing 5 mins a day</title>
    <meta name="description" content="Listening, Reading & Shadowing. 5 mins a day. 毎日5分の日本語学習。">

    <!-- OGP (公開時にURLと画像を差し替え) -->
    <meta property="og:title" content="NIHONGO KEIZOKU">
    <meta property="og:description" content="Listening, Reading & Shadowing - 5 mins a day">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=M+PLUS+Rounded+1c:wght@400;700&family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;          /* 入口画面の間はスクロールさせない */
        }
        body.is-started {
            overflow: auto;            /* START後はスクロールOK */
        }

        /* ===== 入口画面 (Home View) ===== */
        #homeView {
            position: fixed;
            inset: 0;
            padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #homeView.is-leaving {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .home-title {
            font-family: 'Bungee Inline', 'Impact', cursive;
            font-weight: 400;
            font-size: clamp(2.8rem, 13vw, 4.5rem);
            color: #000;
            margin: 0;
            line-height: 1.1;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            text-align: center;
        }

        .home-subtitle {
            font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
            color: var(--muted);
            margin: 15px 0 70px;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.5;
        }
        .home-subtitle .lead {
            display: block;
            font-weight: 900;
            font-size: 1.1rem;
            color: #000;
        }
        .home-subtitle .sub {
            display: block;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .start-btn {
            font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px 50px;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .start-btn:hover {
            transform: translateY(-4px);
            background: var(--primary-hover);
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.45);
        }
        .start-btn:active { transform: translateY(-1px); }
        .start-btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 4px;
        }

        /* ===== コンテンツ画面 (Content View) ===== */
        #contentView {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #contentView.is-visible {
            display: block;
        }
        #contentView.is-shown {
            opacity: 1;
        }

        header {
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid #e2e8f0;
        }
        .logo-wrapper { display: flex; flex-direction: column; }
        .logo {
            font-family: 'Bungee Inline', 'Impact', cursive;
            font-size: 1.5rem;
            color: #000;
            line-height: 1.2;
        }
        .logo-sub {
            font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.3;
        }
        .logo-sub .lead { font-weight: 900; font-size: 0.75rem; color: var(--text); }
        .logo-sub .sub  { font-weight: 400; font-size: 0.65rem; }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .help-btn {
            background: #f1f5f9;
            color: var(--text);
            border: none;
            padding: 10px 18px;
            border-radius: 9999px;
            font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .help-btn:hover { background: #e2e8f0; transform: translateY(-2px); }

        .login-btn {
            background: var(--text);
            color: #fff;
            padding: 10px 20px;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            font-size: 0.85rem;
            font-family: inherit;
        }
        .login-btn:hover { transform: translateY(-2px); }

        main {
            padding: 40px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 {
            font-size: 1.4rem;
            font-weight: 900;
            margin: 0 0 20px;
            color: var(--text);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .section-members { margin-top: 50px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* 記事カードが入るまでの仮表示（次のステップで置き換えます） */
        .placeholder {
            grid-column: 1 / -1;
            padding: 40px 20px;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (prefers-reduced-motion: reduce) {
            #homeView, #contentView, .start-btn { transition: none; }
            .start-btn:hover, .help-btn:hover, .login-btn:hover { transform: none; }
        }
    </style>
</head>
<body>

<!-- ===== 入口画面 ===== -->
<div id="homeView">
    <h1 class="home-title">NIHONGO<br>KEIZOKU</h1>
    <p class="home-subtitle">
        <span class="lead">Listening, Reading &amp; Shadowing</span>
        <span class="sub">5 mins a day</span>
    </p>
    <button type="button" class="start-btn" id="startBtn">START</button>
</div>

<!-- ===== コンテンツ画面 ===== -->
<div id="contentView">
    <header>
        <div class="logo-wrapper">
            <div class="logo">NIHONGO KEIZOKU</div>
            <div class="logo-sub">
                <span class="lead">Listening, Reading &amp; Shadowing</span><br>
                <span class="sub">5 mins a day</span>
            </div>
        </div>
        <div class="header-actions">
            <button type="button" class="help-btn" id="helpBtn">How to use / Cómo usar</button>
            <button type="button" class="login-btn" id="loginBtn">Login</button>
        </div>
    </header>

    <main>
        <section>
            <h2>Open Access / Acceso Abierto</h2>
            <div id="freeGrid" class="grid">
                <div class="placeholder">ここに無料記事のカードが入ります</div>
            </div>
        </section>

        <section class="section-members">
            <h2>Members Only / Solo para miembros</h2>
            <div id="premiumGrid" class="grid">
                <div class="placeholder">ここに会員限定記事のカードが入ります</div>
            </div>
        </section>
    </main>
</div>

<script>
    /* ===== 入口画面：STARTを押したとき ===== */
    const FADE_MS = 500;

    const homeView = document.getElementById('homeView');
    const startBtn = document.getElementById('startBtn');

    function startApp() {
        startBtn.disabled = true;
        homeView.classList.add('is-leaving');   // 入口画面をフェードアウト

        setTimeout(() => {
            window.dispatchEvent(new CustomEvent('keizoku:start'));  // 「始まった」と知らせる
        }, FADE_MS);
    }

    startBtn.addEventListener('click', startApp);

    /* ===== コンテンツ画面：keizoku:start を受け取ったとき ===== */
    const contentView = document.getElementById('contentView');

    window.addEventListener('keizoku:start', () => {
        document.body.classList.add('is-started');     // スクロールを許可
        contentView.classList.add('is-visible');       // 表示する
        setTimeout(() => {
            contentView.classList.add('is-shown');     // ふわっと出す
        }, 50);
    });
</script>
</body>
</html>
